<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Gate - Access Request Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-start justify-center pt-12">
    <div class="max-w-lg w-full mx-4">
        {% if oidc_enabled %}
        <div class="text-right mb-2">
            <a href="{{ url_for('oidc_logout') }}" class="text-sm text-gray-500 hover:text-gray-700 underline">Logout</a>
        </div>
        {% endif %}
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Card Gate - Access Request Generator</h1>

        <!-- Tab Bar -->
        <div class="flex border-b border-gray-300 mb-4">
            <button type="button" id="tab-courses" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600" onclick="switchTab('courses')">By Course</button>
            <button type="button" id="tab-programs" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700" onclick="switchTab('programs')">By Program</button>
            <button type="button" id="tab-employees" class="tab-btn px-4 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700" onclick="switchTab('employees')">Employees</button>
        </div>

        <form action="/generate" method="POST" id="cardgate-form" class="space-y-4">
            <input type="hidden" name="mode" id="mode-input" value="courses">

            <!-- Courses Fields -->
            <div id="courses-fields" class="space-y-4">
                <div>
                    <label for="academic_unit" class="block text-sm font-medium text-gray-700 mb-1">Academic Unit</label>
                    <select id="academic_unit" name="academic_unit" onchange="toggleOther()" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        {% for unit in academic_units %}
                        <option value="{{ unit }}">{{ unit }}</option>
                        {% endfor %}
                    </select>
                    <input type="text" id="academic_unit_other" name="academic_unit_other" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm mt-1" placeholder="Enter unit code (e.g., STAT)">
                </div>

                <div>
                    <label for="building" class="block text-sm font-medium text-gray-700 mb-1">Building</label>
                    <select id="building" name="building" onchange="toggleBuilding()" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        {% for bldg in buildings %}
                        <option value="{{ bldg }}">{{ bldg }}</option>
                        {% endfor %}
                    </select>
                    <input type="text" id="building_other" name="building_other" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm mt-1" placeholder="Enter building name (e.g., Evans)">
                </div>

                <div>
                    <label for="year" class="block text-sm font-medium text-gray-700 mb-1">Year</label>
                    <input type="number" id="year" name="year" value="" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label for="semester" class="block text-sm font-medium text-gray-700 mb-1">Semester</label>
                    <select id="semester" name="semester" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        {% for sem in semesters %}
                        <option value="{{ sem }}">{{ sem.capitalize() }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="from_time" class="block text-sm font-medium text-gray-700 mb-1">From Time (optional)</label>
                    <input type="time" id="from_time" name="from_time" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Programs Fields -->
            <div id="programs-fields" class="hidden space-y-4">
                <div>
                    <label for="program_codes" class="block text-sm font-medium text-gray-700 mb-1">Academic Programs</label>
                    <select id="program_codes" name="program_codes" multiple size="5" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        {% for p in programs %}
                        <option value="{{ p.code }}">{{ p.label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Employees Fields -->
            <div id="employees-fields" class="hidden space-y-4">
                <div>
                    <label for="hr_dept" class="block text-sm font-medium text-gray-700 mb-1">HR Department Code</label>
                    <select id="hr_dept" name="hr_dept" onchange="toggleHRDept()" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        {% for item in hr_department_codes %}
                        {% if item is mapping %}
                        <option value="{{ item.code }}">{{ item.label }}</option>
                        {% else %}
                        <option value="{{ item }}">{{ item }}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                    <input type="text" id="hr_dept_other" name="hr_dept_other" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm mt-1" placeholder="Enter HR dept code (e.g., PSTAT)">
                </div>
            </div>

            <!-- Common Fields -->
            <div>
                <label for="clearances" class="block text-sm font-medium text-gray-700 mb-1">Clearances</label>
                <select id="clearances" name="clearances" multiple size="5" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for c in clearances %}
                    <option value="{{ c }}" selected>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">Generate CSV</button>
        </form>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="hidden fixed inset-0 bg-white bg-opacity-90 flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
        <p id="progress-text" class="mt-4 text-gray-600">Generating CSV...</p>
    </div>

<script>
        function toggleOther() {
            var select = document.getElementById('academic_unit');
            var otherInput = document.getElementById('academic_unit_other');
            if (select.value === 'Other') {
                otherInput.classList.remove('hidden');
            } else {
                otherInput.classList.add('hidden');
            }
        }

        function toggleBuilding() {
            var select = document.getElementById('building');
            var otherInput = document.getElementById('building_other');
            if (select.value === 'Other') {
                otherInput.classList.remove('hidden');
            } else {
                otherInput.classList.add('hidden');
            }
        }

        function toggleHRDept() {
            var select = document.getElementById('hr_dept');
            var otherInput = document.getElementById('hr_dept_other');
            if (select.value === 'Other') {
                otherInput.classList.remove('hidden');
            } else {
                otherInput.classList.add('hidden');
            }
        }

        function switchTab(tab) {
            document.getElementById('mode-input').value = tab;
            document.getElementById('courses-fields').classList.toggle('hidden', tab !== 'courses');
            document.getElementById('programs-fields').classList.toggle('hidden', tab !== 'programs');
            document.getElementById('employees-fields').classList.toggle('hidden', tab !== 'employees');
            var tabs = ['courses', 'programs', 'employees'];
            tabs.forEach(function(t) {
                var btn = document.getElementById('tab-' + t);
                btn.className = t === tab
                    ? 'tab-btn px-4 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600'
                    : 'tab-btn px-4 py-2 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700';
            });
        }

        function setDefaultYear() {
            document.getElementById('year').value = new Date().getFullYear();
        }

        window.onload = function() {
            setDefaultYear();
            document.getElementById('cardgate-form').addEventListener('submit', submitForm);
        };

        async function submitForm(event) {
            event.preventDefault();
            var loading = document.getElementById('loading');
            var progressText = document.getElementById('progress-text');
            var btn = document.getElementById('submit-btn');

            loading.classList.remove('hidden');
            btn.disabled = true;

            var form = document.getElementById('cardgate-form');
            var formData = new FormData(form);

            try {
                var response = await fetch('/generate', { method: 'POST', body: formData });
                var result = await response.json();

                if (!response.ok) {
                    alert('Error: ' + (result.error || response.statusText));
                    btn.disabled = false;
                    loading.classList.add('hidden');
                    return;
                }

                var source = new EventSource('/progress/' + result.job_id);

                source.onmessage = function(event) {
                    try {
                        var msg = JSON.parse(event.data);
                        if (msg.type === 'progress') {
                            progressText.textContent = msg.message;
                        } else if (msg.type === 'done') {
                            source.close();
                            downloadCSV(result.job_id, msg.filename);
                        } else if (msg.type === 'error') {
                            source.close();
                            alert('Error: ' + msg.message);
                            btn.disabled = false;
                            loading.classList.add('hidden');
                        }
                    } catch (e) {
                        console.error('Failed to parse SSE message:', event.data, e);
                    }
                };

                source.onerror = function() {
                    source.close();
                    alert('Connection lost while processing');
                    btn.disabled = false;
                    loading.classList.add('hidden');
                };
            } catch (e) {
                alert('Network error: ' + e.message);
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }

        async function downloadCSV(jobId, filename) {
            try {
                var response = await fetch('/download/' + jobId);
                var blob = await response.blob();
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Download failed: ' + e.message);
            } finally {
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>

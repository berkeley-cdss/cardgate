<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Gate - Access Request Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-lg w-full mx-4">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Card Gate - Access Request Generator</h1>

        <form action="/generate" method="POST" id="cardgate-form" class="space-y-4" onsubmit="return submitForm()">
            <div>
                <label for="academic_unit" class="block text-sm font-medium text-gray-700 mb-1">Academic Unit</label>
                <select id="academic_unit" name="academic_unit" onchange="toggleOther()" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for unit in academic_units %}
                    <option value="{{ unit }}">{{ unit }}</option>
                    {% endfor %}
                </select>
                <input type="text" id="academic_unit_other" name="academic_unit_other" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" placeholder="Enter unit code (e.g., STAT)">
            </div>

            <div>
                <label for="building" class="block text-sm font-medium text-gray-700 mb-1">Building</label>
                <select id="building" name="building" onchange="toggleBuilding()" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for bldg in buildings %}
                    <option value="{{ bldg }}">{{ bldg }}</option>
                    {% endfor %}
                </select>
                <input type="text" id="building_other" name="building_other" class="hidden w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" placeholder="Enter building name (e.g., Evans)">
            </div>

            <div>
                <label for="year" class="block text-sm font-medium text-gray-700 mb-1">Year</label>
                <input type="number" id="year" name="year" value="" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="semester" class="block text-sm font-medium text-gray-700 mb-1">Semester</label>
                <select id="semester" name="semester" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for sem in semesters %}
                    <option value="{{ sem }}">{{ sem.capitalize() }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="clearances" class="block text-sm font-medium text-gray-700 mb-1">Clearances</label>
                <select id="clearances" name="clearances" multiple size="5" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for c in clearances %}
                    <option value="{{ c }}" selected>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="from_time" class="block text-sm font-medium text-gray-700 mb-1">From Time (optional)</label>
                <input type="time" id="from_time" name="from_time" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">Generate CSV</button>
        </form>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="hidden fixed inset-0 bg-white bg-opacity-90 flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
        <p id="progress-text" class="mt-4 text-gray-600">Generating CSV...</p>
    </div>

<script>
        function toggleOther() {
            var select = document.getElementById('academic_unit');
            var otherInput = document.getElementById('academic_unit_other');
            if (select.value === 'Other') {
                otherInput.classList.remove('hidden');
            } else {
                otherInput.classList.add('hidden');
            }
        }

        function toggleBuilding() {
            var select = document.getElementById('building');
            var otherInput = document.getElementById('building_other');
            if (select.value === 'Other') {
                otherInput.classList.remove('hidden');
            } else {
                otherInput.classList.add('hidden');
            }
        }

        function setDefaultYear() {
            document.getElementById('year').value = new Date().getFullYear();
        }
        
        window.onload = setDefaultYear;

        async function submitForm() {
            var loading = document.getElementById('loading');
            var progressText = document.getElementById('progress-text');
            var btn = document.getElementById('submit-btn');
            
            loading.classList.remove('hidden');
            btn.disabled = true;
            
            var form = document.getElementById('cardgate-form');
            var formData = new FormData(form);
            
            try {
                var response = await fetch('/generate', { method: 'POST', body: formData });
                
                if (!response.ok) {
                    var text = await response.text();
                    alert('Error: ' + text);
                    return false;
                }
                
                var reader = response.body.getReader();
                var decoder = new TextDecoder();
                var buffer = '';
                
                while (true) {
                    var result = await reader.read();
                    if (result.done) break;
                    
                    buffer += decoder.decode(result.value, { stream: true });
                    var lines = buffer.split('\n');
                    buffer = lines.pop();
                    
                    for (var line of lines) {
                        if (!line.trim()) continue;
                        try {
                            var msg = JSON.parse(line);
                            if (msg.type === 'progress') {
                                progressText.textContent = msg.message;
                            } else if (msg.type === 'done') {
                                var binaryStr = atob(msg.csv);
                                var bytes = new Uint8Array(binaryStr.length);
                                for (var i = 0; i < binaryStr.length; i++) {
                                    bytes[i] = binaryStr.charCodeAt(i);
                                }
                                var blob = new Blob([bytes], { type: 'text/csv;charset=utf-8' });
                                var url = URL.createObjectURL(blob);
                                var a = document.createElement('a');
                                a.href = url;
                                a.download = msg.filename;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                            } else if (msg.type === 'error') {
                                alert('Error: ' + msg.message);
                            }
                        } catch (e) {
                            console.error('Failed to parse line:', line, e);
                        }
                    }
                }
            } catch (e) {
                alert('Network error: ' + e.message);
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
            
            return false;
        }
    </script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "cardgate"
version = "0.1.0"
description = "Generate card key access spreadsheets for UC Berkeley departments"
authors = [{ name = "Ryan Lovett", email = "rylo@berkeley.edu" }]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "Flask>=2.0.0",
    "Authlib>=1.3.0",
    "cryptography>=41.0.7",
    "requests==2.31.0",
    "sis @ git+https://github.com/ryanlovett/sis-cli.git@v0.4.0",
    "ucbhr @ git+https://github.com/ryanlovett/ucbhr.git@v0.2.1",
    "flask-oidc @ git+https://github.com/berkeley-stat/flask-oidc.git",
]
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
cardgate = "cardgate.cli:app"
